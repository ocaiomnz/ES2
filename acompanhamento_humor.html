<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SAPEA - Acompanhamento de Humor">
    <meta name="theme-color" content="#7B9ACC">
    <title>SAPEA - Acompanhamento de Humor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

    <div id="page-loading" class="page-loading">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>Carregando acompanhamento...</p>
    </div>

    <div id="page-content" class="page-content">
        <header class="page-header">
            <a href="telaresponsavel.html" class="btn-icon" aria-label="Voltar">←</a>
            <h1 class="page-title">Acompanhamento de Humor</h1>
            <span></span>
        </header>
        <main class="page-main" id="main-content">
            <section class="card">
                <h2 class="card-title">Estado Emocional</h2>
                <div class="humor-grid" id="humor-grid"></div>
            </section>
        </main>
        <nav class="bottom-nav">
            <a href="telaresponsavel.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Início</span>
            </a>
            <a href="acompanhamento_humor.html" class="nav-item active">
                <span class="nav-icon">😊</span>
                <span class="nav-label">Humor</span>
            </a>
        </nav>
    </div>

    <script src="js/api.js"></script>
    <script>
        (function () {
            var loading = document.getElementById('page-loading');
            var content = document.getElementById('page-content');
            var gridEl = document.getElementById('humor-grid');

            SAPEA_API.fetchAcompanhamentoHumor().then(function (data) {
                var registros = data.registros || [];
                gridEl.innerHTML = registros.length ? registros.map(function (r) {
                    return '<div class="humor-card">' +
                        '<div class="humor-emoji">' + (r.emoji || '😐') + '</div>' +
                        '<p class="humor-label">' + (r.estado || '') + '</p>' +
                        '<p class="humor-value">' + (r.data_hora || '') + '</p></div>';
                }).join('') : '<p class="text-center" style="color: var(--color-text-light);">Nenhum registro de humor.</p>';

                loading.classList.add('hidden');
                content.classList.add('ready');
            }).catch(function () {
                loading.querySelector('p').textContent = 'Erro ao carregar. Tente de novo.';
                setTimeout(function () {
                    loading.classList.add('hidden');
                    content.classList.add('ready');
                    gridEl.innerHTML = '<p class="text-center" style="color: var(--color-text-light);">Nenhum registro de humor.</p>';
                }, 2000);
            });
        })();
    </script>
</body>
</html>
