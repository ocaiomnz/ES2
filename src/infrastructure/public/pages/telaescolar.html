<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAPEA - Painel da Escola" />
    <meta name="theme-color" content="#7B9ACC" />
    <title>SAPEA - Painel da Escola</title>
    <link rel="stylesheet" href="/stylesheets/design-system.css" />
    <link rel="stylesheet" href="/stylesheets/main.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

    <div id="page-loading" class="page-loading">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Carregando painel escolar...</p>
    </div>

    <div id="page-content" class="page-content">
      <header class="page-header">
        <a
          href="/pages/telaescolar.html"
          class="header-logo"
          aria-label="SAPEA"
        >
          <img src="/logo-sapea.png" alt="SAPEA" />
        </a>
        <h1 class="page-title">Painel da Escola</h1>
        <a
          href="/pages/login.html"
          class="btn btn-secondary"
          style="font-size: 0.875rem; padding: 0.25rem 0.5rem"
          onclick="localStorage.removeItem('sapea_token'); localStorage.removeItem('sapea_crianca_id');"
          >Sair</a
        >
      </header>
      <main class="page-main" id="main-content">
        <section class="card">
          <h2 class="card-title">Crianças Vinculadas</h2>
          <p class="help-text" style="margin-bottom: 1rem">
            Selecione uma criança para ver sua rotina ou usar a interface como
            ela.
          </p>
          <div class="students-list" id="students-list"></div>
        </section>
        <section class="card">
          <h2 class="card-title">Ações Rápidas</h2>
          <div class="action-grid">
            <a href="/pages/gerenciar_rotina.html" class="action-card-btn">
              <span class="action-card-icon">📋</span>
              <span class="action-card-label">Gerenciar Rotina</span>
            </a>
            <a href="/pages/registrar_crise.html" class="action-card-btn">
              <span class="action-card-icon">📝</span>
              <span class="action-card-label">Registrar Crise</span>
            </a>
            <a href="/pages/gerenciar_criancas.html" class="action-card-btn">
              <span class="action-card-icon">👥</span>
              <span class="action-card-label">Gerenciar Crianças</span>
            </a>
            <a href="/pages/gerenciar_ambientes.html" class="action-card-btn">
              <span class="action-card-icon">⚙️</span>
              <span class="action-card-label">Gerenciar Ambientes</span>
            </a>
            <a href="/pages/ambiente.html" class="action-card-btn">
              <span class="action-card-icon">🏫</span>
              <span class="action-card-label">Ambientes</span>
            </a>
          </div>
        </section>
      </main>
    </div>

    <script src="/javascripts/api.js"></script>
    <script>
      (function () {
        if (typeof SAPEA_REQUIRE_AUTH === "function" && !SAPEA_REQUIRE_AUTH())
          return;
        var loading = document.getElementById("page-loading");
        var content = document.getElementById("page-content");
        var listEl = document.getElementById("students-list");

        function statusClass(s) {
          return (s || "").toLowerCase().indexOf("calmo") >= 0
            ? "status-good"
            : "status-warning";
        }

        function badgeClass(risco) {
          var r = (risco || "").toUpperCase();
          if (r === "ALTO") return "badge-high";
          if (r === "MEDIO") return "badge-medium";
          return "badge-low";
        }

        SAPEA_API.fetchTelaescolar()
          .then(function (data) {
            var criancas = data.criancas || [];
            listEl.innerHTML = criancas.length
              ? criancas
                  .map(function (c) {
                    return (
                      '<div class="student-item">' +
                      '<div class="student-avatar">' +
                      (c.avatar || "👤") +
                      "</div>" +
                      '<div class="student-info">' +
                      '<p class="student-name">' +
                      (c.nome || "Criança") +
                      "</p>" +
                      '<p class="student-status ' +
                      statusClass(c.status) +
                      '">Status: ' +
                      (c.status || "—") +
                      "</p>" +
                      "</div>" +
                      '<span class="badge ' +
                      badgeClass(c.nivel_risco) +
                      '">' +
                      (c.nivel_risco || "—") +
                      "</span>" +
                      '<a href="/pages/telacrianca.html" class="btn btn-primary btn-sm" style="margin-left:auto" onclick="localStorage.setItem(\'sapea_crianca_id\', \'' +
                      c.id +
                      "')\">Ver como criança</a></div>"
                    );
                  })
                  .join("")
              : '<p class="text-center" style="color: var(--color-text-light);">Nenhuma criança vinculada.</p>';

            loading.classList.add("hidden");
            content.classList.add("ready");
          })
          .catch(function () {
            loading.querySelector("p").textContent =
              "Erro ao carregar. Tente de novo.";
            setTimeout(function () {
              loading.classList.add("hidden");
              content.classList.add("ready");
              listEl.innerHTML =
                '<p class="text-center" style="color: var(--color-text-light);">Nenhuma criança vinculada.</p>';
            }, 2000);
          });
      })();
    </script>
  </body>
</html>
