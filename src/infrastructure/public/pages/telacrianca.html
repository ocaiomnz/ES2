<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAPEA - Interface da Criança" />
    <meta name="theme-color" content="#7B9ACC" />
    <title>SAPEA - Tela Criança</title>
    <link rel="stylesheet" href="/stylesheets/design-system.css" />
    <link rel="stylesheet" href="/stylesheets/main.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

    <div id="page-loading" class="page-loading">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Carregando sua rotina...</p>
    </div>

    <div id="page-content" class="page-content">
      <header class="tela-crianca-header page-header">
        <div class="header-content">
          <h2 class="header-title page-title" id="header-title">Olá! 👋</h2>
          <div style="display: flex; gap: 0.5rem; align-items: center">
            <div class="time-display" id="current-time">--:--</div>
            <a
              href="/pages/login.html"
              class="btn btn-secondary"
              style="font-size: 0.875rem; padding: 0.25rem 0.5rem"
              onclick="localStorage.removeItem('sapea_token'); localStorage.removeItem('sapea_crianca_id');"
              >Sair</a
            >
          </div>
        </div>
      </header>
      <main class="tela-crianca-main page-main" id="main-content">
        <h3 class="section-title">Sua Rotina de Hoje</h3>
        <div class="timeline-container" id="timeline-container"></div>
        <section class="actions-section">
          <a href="/pages/ambiente.html" class="action-btn">
            <span class="action-icon">🏫</span>
            <span class="action-label">Ver Lugares</span>
          </a>
          <button type="button" class="action-btn" id="btn-ajuda">
            <span class="action-icon">💙</span>
            <span class="action-label">Preciso de Ajuda</span>
          </button>
        </section>
      </main>
      <button
        class="sos-button"
        id="sos-btn"
        aria-label="Preciso de ajuda urgente"
      >
        <span class="sos-icon">🆘</span>
        <span class="sos-text">Ajuda</span>
      </button>
    </div>

    <!-- Modal Preciso de Ajuda -->
    <div
      id="modal-ajuda"
      class="modal-overlay"
      role="dialog"
      aria-labelledby="modal-ajuda-title"
    >
      <div class="modal-box">
        <button
          class="modal-close"
          onclick="fecharModalAjuda()"
          aria-label="Fechar"
        >
          ✕
        </button>
        <div class="alerta-crise-content" style="text-align: center">
          <div class="alerta-crise-icon" style="font-size: 4rem">💙</div>
          <h2 class="modal-title" id="modal-ajuda-title">Ajuda Enviada!</h2>
          <p class="alerta-crise-message">
            Alguém virá te ajudar em breve. Você está seguro.
          </p>
          <button
            type="button"
            class="btn btn-primary btn-large"
            onclick="fecharModalAjuda()"
          >
            Entendi
          </button>
        </div>
      </div>
    </div>

    <script src="/javascripts/api.js"></script>
    <script>
      (function () {
        if (typeof SAPEA_REQUIRE_AUTH === "function" && !SAPEA_REQUIRE_AUTH())
          return;
        var loading = document.getElementById("page-loading");
        var content = document.getElementById("page-content");
        var titleEl = document.getElementById("header-title");
        var timelineEl = document.getElementById("timeline-container");
        var timeEl = document.getElementById("current-time");

        function formatTime(str) {
          if (!str) return "--:--";
          var d = new Date(str);
          if (isNaN(d.getTime())) return str;
          return d.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function statusClass(status) {
          if (status === "CONCLUIDO") return "completed";
          if (status === "EM_ANDAMENTO") return "active";
          return "upcoming";
        }

        function labelStatus(status) {
          if (status === "CONCLUIDO") return "";
          if (status === "EM_ANDAMENTO") return "AGORA";
          return "DEPOIS";
        }

        function renderTimeline(eventos) {
          if (!eventos || !eventos.length) {
            timelineEl.innerHTML =
              '<p class="text-center" style="color: var(--color-text-light);">Nenhum evento hoje.</p>';
            return;
          }
          timelineEl.innerHTML = eventos
            .map(function (ev) {
              var cls = statusClass(ev.status);
              var label = labelStatus(ev.status);
              var progress =
                ev.progresso != null
                  ? '<div class="progress-bar-container"><div class="progress-bar" style="width: ' +
                    ev.progresso +
                    '%"></div></div><p class="timeline-time">Faltam ' +
                    (100 - ev.progresso) +
                    " min</p>"
                  : '<p class="timeline-time">' +
                    formatTime(ev.data_hora_inicio) +
                    "</p>";
              var iconSize =
                ev.status === "EM_ANDAMENTO"
                  ? "timeline-icon-large"
                  : "timeline-icon";
              return (
                '<div class="timeline-item ' +
                cls +
                '">' +
                '<div class="' +
                iconSize +
                '">' +
                (ev.icone || "📌") +
                "</div>" +
                '<div class="timeline-content">' +
                (label ? '<p class="timeline-label">' + label + "</p>" : "") +
                '<p class="timeline-activity">' +
                (ev.titulo || "") +
                "</p>" +
                progress +
                "</div></div>"
              );
            })
            .join("");
        }

        function updateClock() {
          var now = new Date();
          timeEl.textContent = now.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        SAPEA_API.fetchTelacrianca()
          .then(function (data) {
            var crianca = data.crianca || {};
            var eventos = data.eventos || [];
            titleEl.textContent =
              "Olá" + (crianca.id ? ", Criança" : "") + "! 👋";
            renderTimeline(eventos);
            updateClock();
            setInterval(updateClock, 1000);
            loading.classList.add("hidden");
            content.classList.add("ready");
          })
          .catch(function () {
            loading.querySelector("p").textContent =
              "Não foi possível carregar. Tente de novo.";
            setTimeout(function () {
              loading.classList.add("hidden");
              content.classList.add("ready");
              titleEl.textContent = "Olá! 👋";
              renderTimeline([]);
            }, 2000);
          });

        function abrirModalAjuda() {
          var modal = document.getElementById("modal-ajuda");
          if (modal) modal.classList.add("active");
        }
        window.fecharModalAjuda = function () {
          var modal = document.getElementById("modal-ajuda");
          if (modal) modal.classList.remove("active");
        };
        function acionarAjuda() {
          var criancaId = localStorage.getItem("sapea_crianca_id");
          if (!criancaId) {
            var msg =
              "Para solicitar ajuda em uma emergência, é preciso estar logado e ter uma criança selecionada. ";
            msg +=
              'Vá ao Painel da Escola ou do Responsável e selecione "Ver como criança" para configurar.';
            alert(msg);
            return;
          }
          SAPEA_API.solicitarSuporte(criancaId)
            .then(function () {
              abrirModalAjuda();
            })
            .catch(function (err) {
              alert(err.message || "Erro ao solicitar ajuda. Tente novamente.");
            });
        }
        document
          .getElementById("sos-btn")
          .addEventListener("click", acionarAjuda);
        document
          .getElementById("btn-ajuda")
          .addEventListener("click", acionarAjuda);
      })();
    </script>
  </body>
</html>
